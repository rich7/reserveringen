<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beheer reserveringen</title>
<style>
  :root {
    --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; --bg: #f1f5f9; --card: #ffffff; --soft: #f8fafc;
    --vrij: #22c55e; --beperkt: #f59e0b; --vol: #dc2626; --gesloten: #cbd5e1; --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.4;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(15, 23, 42, .07); }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .btn { padding: 11px 16px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-weight: 700; font-size: 14px; }
  .btn.licht { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.klein { padding: 8px 12px; font-size: 13px; }
  .btn.gevaar { background: #b91c1c; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  input[type="password"], input[type="search"], input[type="date"],
  .veld input:not([type="checkbox"]):not([type="radio"]), .veld textarea {
    width: 100%; padding: 12px 13px; border: 1.5px solid var(--line); border-radius: 10px;
    font: inherit; font-size: 15px; background: #fff; color: var(--ink);
  }
  .veld textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus { outline: none; border-color: var(--ink); }

  .melding { padding: 10px 12px; border-radius: 10px; font-size: 13px; margin: 0 0 12px; background: #fef2f2; color: #b91c1c; }
  .melding button { background: none; border: 0; padding: 0; margin-left: 8px; font-weight: 700; color: inherit; text-decoration: underline; }

  /* Inloggen */
  .login { max-width: 380px; margin: 12vh auto 0; padding: 26px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; }
  .login p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 12px 0 16px; font-size: 13px; color: #334155; }
  .check input { width: 18px; height: 18px; margin-top: 1px; flex: none; }
  .login .btn { width: 100%; padding: 13px; }

  /* Kop */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .top h1 { margin: 0; font-size: 20px; }
  .top small { color: var(--muted); }
  .top-actions { display: flex; gap: 8px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .toolbar .btn:first-child { flex: 1 1 auto; }

  .zoek { position: relative; margin-bottom: 12px; }
  .zoek input { padding-right: 46px; }
  .zoek button { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 0; border-radius: 8px; background: var(--soft); font-size: 16px; }

  /* Datum */
  .datumnav { display: grid; grid-template-columns: 48px 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .pijl { height: 48px; border: 0; border-radius: 12px; background: #fff; font-size: 26px; line-height: 1; box-shadow: 0 2px 8px rgba(15, 23, 42, .06); }
  .pijl:hover { background: var(--line); }
  .datumtitel { text-align: center; font-weight: 700; font-size: 17px; text-transform: capitalize; }
  .datumtools { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .datumtools input { width: auto; padding: 8px 10px; font-size: 14px; }

  /* Weekstrook */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 12px; }
  .wdag { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 8px 2px; border: 0; border-radius: 12px; background: #fff; color: var(--ink); }
  .wdag:hover:not(:disabled) { background: var(--line); }
  .wdag:disabled { opacity: .35; cursor: default; }
  .wn { font-size: 11px; color: var(--muted); font-weight: 600; }
  .wd { font-size: 16px; font-weight: 700; }
  .wbalk { display: block; width: 80%; height: 5px; border-radius: 5px; background: var(--line); overflow: hidden; }
  .wbalk i { display: block; height: 100%; border-radius: 5px; background: var(--vrij); }
  .wdag.s-beperkt .wbalk i { background: var(--beperkt); }
  .wdag.s-vol .wbalk i { background: var(--vol); }
  .wdag.s-gesloten { opacity: .55; }
  .wa { font-size: 10px; color: var(--muted); }
  .wdag.sel { background: var(--ink); color: #fff; opacity: 1; }
  .wdag.sel .wn, .wdag.sel .wa { color: #cbd5e1; }
  .wdag.sel .wbalk { background: rgba(255, 255, 255, .25); }

  /* Dagtotalen */
  .samenvatting { padding: 14px 16px; margin-bottom: 14px; }
  .sam-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; }
  .badge.s-vrij { background: var(--vrij); }
  .badge.s-beperkt { background: var(--beperkt); }
  .badge.s-vol { background: var(--vol); }
  .badge.s-gesloten { background: #94a3b8; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 22px; }
  .stats span { font-size: 12px; color: var(--muted); }
  .balk { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; margin-top: 12px; }
  .balk i { display: block; height: 100%; border-radius: 8px; }

  /* Reserveringen */
  .tijdkop { display: flex; justify-content: space-between; align-items: baseline; margin: 18px 2px 8px; font-size: 16px; }
  .tijdkop small { color: var(--muted); font-size: 12px; font-weight: 500; }
  .res { background: #fff; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(15, 23, 42, .05); border-left: 5px solid var(--ink); }
  .res.st-aangekomen { border-left-color: #16a34a; }
  .res.st-no-show { border-left-color: var(--beperkt); }
  .res.st-geannuleerd { border-left-color: var(--gesloten); opacity: .65; }
  .res.st-geannuleerd .naam { text-decoration: line-through; }
  .res-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .naam { font-weight: 700; font-size: 16px; }
  .pers { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #e2e8f0; color: #334155; }
  .tag.warn { background: #fef3c7; color: #92400e; }
  .tag.tel { background: #dbeafe; color: #1e40af; }
  .res-contact { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; font-size: 14px; word-break: break-all; }
  .res-contact a { color: #1d4ed8; text-decoration: none; }
  .res-opm { font-size: 13px; color: #334155; background: var(--soft); border-radius: 8px; padding: 6px 9px; margin: 6px 0; }
  .res-onder { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 6px; }
  .res-acties { display: flex; align-items: center; gap: 8px; }
  .res-id { font-size: 11px; color: var(--muted); }
  .statusSel { padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; background: #fff; color: var(--ink); }
  .print-status { display: none; font-weight: 700; font-size: 13px; }
  .leeg { text-align: center; color: var(--muted); padding: 28px 10px; }

  /* Zoekresultaten */
  .zres { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: #fff; border: 0; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 2px 8px rgba(15, 23, 42, .05); color: var(--ink); }
  .zres:hover { background: var(--soft); }
  .zres small { display: block; color: var(--muted); font-size: 12px; text-transform: capitalize; }
  .zres .rechts { text-align: right; font-size: 13px; white-space: nowrap; }

  .foot { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 0 6px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: 90vw; background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); z-index: 40; }
  .toast.fout { background: #b91c1c; }
  .print-only { display: none; }

  /* Venster (formulieren) */
  .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, .55); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: #fff; width: 100%; max-width: 540px; max-height: 94vh; display: flex; flex-direction: column; border-radius: 18px 18px 0 0; outline: none; }
  @media (min-width: 640px) { .overlay { align-items: center; padding: 16px; } .modal { border-radius: 18px; max-height: 90vh; } }
  .m-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .m-head h2 { margin: 0; font-size: 18px; }
  .icon-btn { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--soft); font-size: 20px; line-height: 1; color: var(--ink); }
  .icon-btn:hover:not(:disabled) { background: var(--line); }
  .icon-btn:disabled { opacity: .3; cursor: not-allowed; }
  .m-body { padding: 16px 18px; overflow-y: auto; flex: 1; }
  .m-foot { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--line); }
  .m-foot .btn { flex: 1; padding: 13px; }

  .sec { margin-bottom: 16px; }
  .lbl { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
  .veld { margin-bottom: 14px; }
  .veld label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
  .hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .hint.warn { color: #b45309; font-weight: 600; }
  .uitleg { margin: 0 0 14px; font-size: 14px; color: #334155; }

  .maandnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .maandnav strong { text-transform: capitalize; font-size: 15px; }
  .kgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .khead { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .kday { height: 42px; border: 0; border-radius: 10px; background: var(--soft); font-weight: 600; font-size: 14px; color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .kday .dot { width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .kday.s-vrij .dot { background: var(--vrij); }
  .kday.s-beperkt .dot { background: var(--beperkt); }
  .kday.s-vol .dot { background: var(--vol); }
  .kday.s-gesloten .dot { background: var(--gesloten); }
  .kday.s-gesloten:not(.sel) { color: #64748b; }
  .kday:hover:not(.off):not(.sel) { background: var(--line); }
  .kday.off { opacity: .3; cursor: not-allowed; }
  .kday.sel { background: var(--ink); color: #fff; }
  .klegenda { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: center; margin-top: 8px; font-size: 11px; color: var(--muted); }
  .klegenda i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

  .tkgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tk { position: relative; }
  .tk input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
  .tk span { display: block; text-align: center; padding: 10px 0; border-radius: 10px; background: var(--soft); font-size: 14px; font-weight: 600; }
  .tk:hover span { background: var(--line); }
  .tk input:checked + span { background: var(--ink); color: #fff; }
  .tk input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }

  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper .icon-btn { width: 46px; height: 46px; font-size: 24px; }
  .stepper input { width: 90px; text-align: center; font-size: 20px; font-weight: 700; padding: 8px; border: 1.5px solid var(--line); border-radius: 10px; font-family: inherit; }

  .oBox { background: var(--soft); border-radius: 12px; padding: 12px 14px; margin: 12px 0; font-size: 14px; }
  .orij { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .orij span { color: var(--muted); }

  @media (max-width: 420px) {
    .top-actions .btn { padding: 8px 10px; }
    .wd { font-size: 14px; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    .noprint { display: none !important; }
    .print-only { display: block; margin-bottom: 10px; }
    .print-only h1 { margin: 0; font-size: 20px; text-transform: capitalize; }
    .card, .res { box-shadow: none; border: 1px solid #cbd5e1; }
    .res { break-inside: avoid; }
    .statusSel { display: none; }
    .print-status { display: inline; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- INLOGGEN -->
  <section class="login card" id="login">
    <h1>Beheer</h1>
    <p>Voer de beheerpincode in om de reserveringen te bekijken.</p>
    <div class="melding" id="loginFout" role="alert" hidden></div>
    <form id="loginForm">
      <label for="pin" style="position:absolute;left:-9999px">Pincode</label>
      <input type="password" id="pin" placeholder="Pincode" autocomplete="current-password" required>
      <label class="check"><input type="checkbox" id="onthoud"> Onthoud op dit apparaat</label>
      <button type="submit" class="btn" id="loginKnop">Inloggen</button>
    </form>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <div class="print-only"><h1 id="printTitel"></h1></div>

    <header class="top noprint">
      <div>
        <h1 id="restaurant">Beheer</h1>
        <small>Reserveringen</small>
      </div>
      <div class="top-actions">
        <button type="button" class="btn licht klein" id="vernieuw" aria-label="Vernieuwen">&#8635;</button>
        <button type="button" class="btn klein" id="uitloggen">Uitloggen</button>
      </div>
    </header>

    <div class="toolbar noprint">
      <button type="button" class="btn" id="nieuwKnop">+ Nieuwe reservering</button>
      <button type="button" class="btn licht" id="printKnop">Printen</button>
      <button type="button" class="btn licht" id="opschoonKnop">Opschonen</button>
    </div>

    <div class="melding noprint" id="fout" role="alert" hidden><span id="foutTekst"></span><button type="button" id="opnieuw">Opnieuw proberen</button></div>

    <div class="zoek noprint">
      <input type="search" id="zoek" placeholder="Zoek op naam, telefoon of boekingsnummer" autocomplete="off" aria-label="Zoeken">
      <button type="button" id="zoekWis" aria-label="Zoekopdracht wissen" hidden>&#10005;</button>
    </div>

    <section id="dagView">
      <div class="datumnav noprint">
        <button type="button" class="pijl" id="vorigeDag" aria-label="Vorige dag">&#8249;</button>
        <div class="datumtitel" id="datumTitel" aria-live="polite"></div>
        <button type="button" class="pijl" id="volgendeDag" aria-label="Volgende dag">&#8250;</button>
      </div>
      <div class="datumtools noprint">
        <button type="button" class="btn licht klein" id="vandaagKnop">Vandaag</button>
        <input type="date" id="datumKies" aria-label="Kies een datum">
      </div>
      <div class="week noprint" id="week" role="group" aria-label="Week"></div>
      <div class="samenvatting card" id="dagSamenvatting"></div>
      <div id="lijst"></div>
    </section>

    <section id="zoekView" hidden>
      <h2 style="font-size:17px;margin:4px 2px 10px">Zoekresultaten</h2>
      <div id="zoekLijst"></div>
    </section>

    <p class="foot noprint" id="bijgewerkt"></p>
  </div>
</div>

<!-- Venster voor formulieren -->
<div class="overlay noprint" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitel" tabindex="-1">
    <div class="m-head">
      <h2 id="mTitel"></h2>
      <button type="button" class="icon-btn" id="mSluit" aria-label="Sluiten">&#10005;</button>
    </div>
    <div class="m-body" id="mBody"></div>
    <div class="m-foot" id="mFoot"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
(function () {
  "use strict";

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyaqAHC-i6eD2l5fDHPRpkBEGrgXKnnrc7HpQRSBtd9cPDKIuw8EyGO5TMaqUDZz3VG4g/exec";

  const STATUSSEN = ["Bevestigd", "Aangekomen", "No-show", "Geannuleerd"];
  const DAGNAMEN_KORT = ["Zo", "Ma", "Di", "Wo", "Do", "Vr", "Za"];
  const MA_EERST = ["Ma", "Di", "Wo", "Do", "Vr", "Za", "Zo"];
  const STATUS_TEKST = { VRIJ: "Vrij", BEPERKT: "Beperkt", VOL: "Vol", GESLOTEN: "Gesloten" };
  const STATUS_KLEUR = { VRIJ: "var(--vrij)", BEPERKT: "var(--beperkt)", VOL: "var(--vol)", GESLOTEN: "var(--gesloten)" };
  const SLEUTEL = "beheer_pin";
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const $ = function (id) { return document.getElementById(id); };
  const pad = function (n) { return String(n).padStart(2, "0"); };

  // ===== Gegevens in het geheugen (er wordt niets van de reserveringen in de browser opgeslagen) =====
  let pin = "";
  let dagen = {};          // datum -> dagtotalen
  let res = {};            // datum -> reserveringen (gesorteerd op tijd)
  let venster = null;      // { van, tot } van de geladen periode
  let kalenderBoek = {};   // datum -> { status, vrij } voor de hele boekbare periode
  let cfg = { tijden: [], maxPersonen: 10, maxPersonenTel: 30, perTafel: 4, bewaartermijn: 3 };
  let restaurant = "Beheer";
  let vandaag = "";
  let datum = "";          // getoonde datum
  let kent = new Set();    // bekende boekingsnummers, om nieuwe reserveringen te melden
  let bijgewerktTekst = "";
  let reqTeller = 0;
  let zoekTeller = 0;
  let pending = 0;         // aantal statuswijzigingen dat nog wordt opgeslagen
  let zoekTimer = null;
  let toastTimer = null;
  let form = null;         // het openstaande reserveringsformulier
  let modalOpen = false;
  let modalOpener = null;

  // ===== Hulpfuncties =====
  function el(tag, props, kids) {
    const n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      if (k === "class") n.className = props[k];
      else if (k === "text") n.textContent = props[k];
      else if (k.slice(0, 2) === "on") n.addEventListener(k.slice(2), props[k]);
      else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { if (c) n.append(c); });
    return n;
  }

  function deel(key) { return key.split("-").map(Number); }
  function addDagen(key, n) {
    const p = deel(key);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }
  function weekdag(key) {
    const p = deel(key);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
  }
  function mooi(key, kort) {
    const p = deel(key);
    const d = new Date(p[0], p[1] - 1, p[2]);
    return d.toLocaleDateString("nl-NL", kort
      ? { weekday: "short", day: "numeric", month: "short" }
      : { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z]/g, "-"); }

  function toast(tekst, isFout) {
    const t = $("toast");
    t.textContent = tekst;
    t.className = "toast" + (isFout ? " fout" : "");
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 7000);
  }

  function toonFout(tekst) { $("foutTekst").textContent = tekst; $("fout").hidden = false; }
  function verbergFout() { $("fout").hidden = true; }

  // ===== Server =====
  function wacht(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // pogingen > 1 alleen voor acties die veilig opnieuw gedaan kunnen worden (lezen, zoeken, status zetten).
  // Boeken, wijzigen en opschonen worden nooit automatisch herhaald.
  async function api(body, opts) {
    const o = opts || {};
    const pogingen = o.pogingen || 1;
    const timeout = o.timeout || 20000;
    let laatste = null;
    for (let i = 0; i < pogingen; i++) {
      if (i > 0) await wacht(800 * i);
      const ctl = new AbortController();
      const timer = setTimeout(function () { ctl.abort(); }, timeout);
      try {
        // Geen custom headers: zo kunnen we het antwoord van Apps Script gewoon lezen
        const res2 = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(Object.assign({ pin: pin }, body)),
          signal: ctl.signal
        });
        const data = JSON.parse(await res2.text());   // een foutpagina van Google is geen JSON en telt als mislukt
        clearTimeout(timer);
        return data;
      } catch (err) {
        clearTimeout(timer);
        laatste = err;
      }
    }
    throw laatste;
  }

  // ===== Inloggen / uitloggen =====
  function bewaarPin(onthoud) {
    try {
      sessionStorage.setItem(SLEUTEL, pin);
      if (onthoud) localStorage.setItem(SLEUTEL, pin); else localStorage.removeItem(SLEUTEL);
    } catch (e) {}
  }
  function wisPin() {
    try { sessionStorage.removeItem(SLEUTEL); localStorage.removeItem(SLEUTEL); } catch (e) {}
  }
  function toonLogin(bericht) {
    $("app").hidden = true;
    $("login").hidden = false;
    const m = $("loginFout");
    if (bericht) { m.textContent = bericht; m.hidden = false; } else { m.hidden = true; }
    $("pin").value = "";
    $("pin").focus();
  }
  function toonApp() { $("login").hidden = true; $("app").hidden = false; }

  function uitloggen(bericht) {
    if (modalOpen) sluitModal(true);
    pin = ""; dagen = {}; res = {}; venster = null; kalenderBoek = {}; datum = ""; vandaag = ""; kent = new Set();
    zoekTeller++;
    wisPin();
    toonLogin(bericht || "");
  }

  $("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    const invoer = $("pin").value.trim();
    if (!invoer) return;
    const knop = $("loginKnop");
    knop.disabled = true;
    knop.textContent = "Controleren…";
    $("loginFout").hidden = true;
    pin = invoer;
    try {
      // Eén aanroep: controleert de pincode en haalt meteen de hele periode op
      const r = await api({ actie: "beheer_bereik", van: "", tot: "" }, { pogingen: 2 });
      if (r.result === "success") {
        bewaarPin($("onthoud").checked);
        toonApp();
        neem(r, false);
        render();
      } else {
        pin = "";
        $("loginFout").textContent = r.message || "Inloggen mislukt.";
        $("loginFout").hidden = false;
      }
    } catch (err) {
      pin = "";
      $("loginFout").textContent = "Geen verbinding met de server. Probeer het opnieuw.";
      $("loginFout").hidden = false;
    }
    knop.disabled = false;
    knop.textContent = "Inloggen";
  });

  $("uitloggen").addEventListener("click", function () { uitloggen(""); });

  // ===== Gegevens laden =====
  function neem(r, meldNieuw) {
    restaurant = r.restaurant || "Beheer";
    vandaag = r.vandaag;
    dagen = {};
    r.dagen.forEach(function (d) { dagen[d.datum] = d; });
    res = {};
    r.reserveringen.forEach(function (x) {
      if (!res[x.datum]) res[x.datum] = [];
      res[x.datum].push(x);
    });
    kalenderBoek = r.kalender || {};
    cfg = Object.assign({}, cfg, r.config || {});
    if (meldNieuw) {
      r.reserveringen.forEach(function (x) {
        if (!kent.has(x.id)) toast("Nieuwe reservering: " + x.naam + " (" + mooi(x.datum, true) + ", " + x.tijd + ", " + x.personen + " pers.)");
      });
    }
    kent = new Set(r.reserveringen.map(function (x) { return x.id; }));
    venster = { van: r.van, tot: r.tot };
    if (!datum) datum = r.vandaag;
    bijgewerktTekst = "Bijgewerkt om " +
      new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }) +
      " · ververst automatisch elke minuut";
  }

  // Haalt een periode op. Geeft true terug als het gelukt is.
  async function laadBereik(van, tot, opties) {
    const o = opties || {};
    const mijn = ++reqTeller;
    if (venster && !o.stil) { $("bijgewerkt").textContent = "Verversen…"; }
    let r;
    try {
      r = await api({ actie: "beheer_bereik", van: van, tot: tot }, { pogingen: o.stil ? 2 : 3 });
    } catch (err) {
      if (mijn !== reqTeller) return false;
      if (!o.stil) toonFout("Geen verbinding met de server.");
      if (venster) $("bijgewerkt").textContent = bijgewerktTekst;
      return false;
    }
    if (mijn !== reqTeller) return false;  // er is intussen iets nieuwers gestart
    if (r.result !== "success") {
      if (r.code === "PIN") { uitloggen(r.message); return false; }
      if (!o.stil) toonFout(r.message || "Er ging iets mis.");
      if (venster) $("bijgewerkt").textContent = bijgewerktTekst;
      return false;
    }
    verbergFout();
    neem(r, !!o.meldNieuw);
    render();
    return true;
  }

  function herlaad(stil) {
    if (venster) return laadBereik(venster.van, venster.tot, { stil: !!stil, meldNieuw: true });
    return laadBereik("", "", { meldNieuw: false });
  }

  // Na een nieuwe of gewijzigde reservering: ga naar de datum en haal de gegevens opnieuw op
  async function naWijziging(d) {
    const maandag = addDagen(d, -((weekdag(d) + 6) % 7));
    let van, tot;
    if (venster && maandag >= venster.van && addDagen(maandag, 6) <= venster.tot) { van = venster.van; tot = venster.tot; }
    else { van = addDagen(d, -14); tot = addDagen(d, 42); }
    $("zoek").value = "";
    $("zoekWis").hidden = true;
    zoekTeller++;
    toonDag();
    datum = d;
    await laadBereik(van, tot, { meldNieuw: false });
  }

  // ===== Weergave =====
  function render() {
    if (!venster) return;
    $("restaurant").textContent = restaurant;
    $("datumTitel").textContent = mooi(datum);
    $("datumKies").value = datum;
    $("vandaagKnop").disabled = (datum === vandaag);
    $("printTitel").textContent = restaurant + " – " + mooi(datum);
    renderWeek();
    renderSamenvatting();
    renderLijst();
    $("bijgewerkt").textContent = bijgewerktTekst;
  }

  function renderWeek() {
    const w = $("week");
    w.textContent = "";
    const maandag = addDagen(datum, -((weekdag(datum) + 6) % 7));
    for (let i = 0; i < 7; i++) {
      const key = addDagen(maandag, i);
      const d = dagen[key];
      const nr = String(parseInt(key.slice(8), 10));
      if (!d) {
        w.append(el("button", { type: "button", class: "wdag", disabled: "", "aria-label": mooi(key) + ", niet geladen" }, [
          el("span", { class: "wn", text: DAGNAMEN_KORT[weekdag(key)] }),
          el("span", { class: "wd", text: nr })
        ]));
        continue;
      }
      const pct = d.maxTafels > 0 ? Math.min(100, Math.round(d.bezetTafels / d.maxTafels * 100)) : (d.status === "VOL" ? 100 : 0);
      const gekozen = key === datum;
      w.append(el("button", {
        type: "button",
        class: "wdag s-" + d.status.toLowerCase() + (gekozen ? " sel" : ""),
        "aria-pressed": gekozen ? "true" : "false",
        "aria-label": mooi(key) + ", " + STATUS_TEKST[d.status] + ", " + d.reserveringen + " reserveringen",
        onclick: function () { gaNaar(key); }
      }, [
        el("span", { class: "wn", text: DAGNAMEN_KORT[weekdag(key)] }),
        el("span", { class: "wd", text: nr }),
        el("span", { class: "wbalk" }, [el("i", { style: "width:" + (d.gesloten ? 0 : pct) + "%" })]),
        el("span", { class: "wa", text: d.gesloten && !d.reserveringen ? "dicht" : String(d.reserveringen) })
      ]));
    }
  }

  function stat(waarde, label) {
    return el("div", null, [el("b", { text: String(waarde) }), el("span", { text: label })]);
  }

  function renderSamenvatting() {
    const d = dagen[datum];
    const box = $("dagSamenvatting");
    box.textContent = "";
    if (!d) { box.append(el("p", { class: "leeg", text: "Geen gegevens voor deze dag." })); return; }
    const pct = d.maxTafels > 0 ? Math.min(100, Math.round(d.bezetTafels / d.maxTafels * 100)) : (d.status === "VOL" ? 100 : 0);
    box.append(
      el("div", { class: "sam-top" }, [
        el("strong", { text: d.gesloten ? "Gesloten dag" : "Dagoverzicht" }),
        el("span", { class: "badge s-" + d.status.toLowerCase(), text: STATUS_TEKST[d.status] })
      ]),
      el("div", { class: "stats" }, [
        stat(d.reserveringen, "reserveringen"),
        stat(d.personen, "personen"),
        stat(d.gesloten ? "–" : d.bezetTafels + " / " + d.maxTafels, "tafels bezet")
      ]),
      el("div", { class: "balk" }, [el("i", { style: "width:" + (d.gesloten ? 0 : pct) + "%;background:" + STATUS_KLEUR[d.status] })])
    );
  }

  function renderLijst() {
    const lijst = $("lijst");
    lijst.textContent = "";
    const items = res[datum] || [];
    const d = dagen[datum];
    if (!items.length) {
      lijst.append(el("p", { class: "leeg", text: d && d.gesloten ? "We zijn deze dag gesloten." : "Geen reserveringen voor deze dag." }));
      return;
    }
    const groepen = {};
    const volgorde = [];
    items.forEach(function (x) {
      const t = x.tijd || "";
      if (!groepen[t]) { groepen[t] = []; volgorde.push(t); }
      groepen[t].push(x);
    });
    volgorde.forEach(function (t) {
      const actief = groepen[t].filter(function (x) { return x.status !== "Geannuleerd"; });
      const pers = actief.reduce(function (a, x) { return a + x.personen; }, 0);
      lijst.append(el("h3", { class: "tijdkop" }, [
        el("span", { text: t || "Tijd onbekend" }),
        el("small", { text: actief.length ? actief.length + " res. · " + pers + " pers." : "alleen geannuleerd" })
      ]));
      groepen[t].forEach(function (x) { lijst.append(kaart(x)); });
    });
  }

  function kaart(x) {
    const sel = el("select", {
      class: "statusSel",
      "aria-label": "Status van " + x.naam,
      onchange: function (e) { wijzigStatus(x, e.target); }
    });
    const opties = STATUSSEN.indexOf(x.status) === -1 ? STATUSSEN.concat([x.status]) : STATUSSEN;
    opties.forEach(function (s) {
      const o = el("option", { value: s, text: s });
      if (s === x.status) o.selected = true;
      sel.append(o);
    });

    const contact = el("div", { class: "res-contact" });
    const telCijfers = (x.telefoon || "").replace(/[^\d+]/g, "");
    if (telCijfers) contact.append(el("a", { href: "tel:" + telCijfers, text: x.telefoon }));
    if (/^[^\s@]+@[^\s@]+$/.test(x.email || "")) contact.append(el("a", { href: "mailto:" + x.email, text: x.email }));

    const tags = el("div", { class: "tags" });
    if (x.bron === "Telefoon") tags.append(el("span", { class: "tag tel", text: "Telefonisch" }));
    if (x.eerderNoShow > 0) tags.append(el("span", { class: "tag warn", text: "Eerder " + x.eerderNoShow + "× no-show" }));

    const kanWijzigen = x.datum >= vandaag && x.status !== "Geannuleerd" && x.status !== "No-show";
    const acties = el("div", { class: "res-acties" });
    if (kanWijzigen) acties.append(el("button", {
      type: "button", class: "btn licht klein noprint", text: "Wijzig",
      onclick: function () { openForm("wijzig", x); }
    }));
    acties.append(sel, el("span", { class: "print-status", text: x.status }));

    return el("div", { class: "res st-" + slug(x.status) }, [
      el("div", { class: "res-top" }, [
        el("span", { class: "naam", text: x.naam }),
        el("span", { class: "pers", text: x.personen + " pers. · " + x.tafels + (x.tafels === 1 ? " tafel" : " tafels") })
      ]),
      tags.childNodes.length ? tags : null,
      contact.childNodes.length ? contact : null,
      x.opmerking ? el("div", { class: "res-opm", text: "Opmerking: " + x.opmerking }) : null,
      el("div", { class: "res-onder" }, [
        el("span", { class: "res-id", text: x.id }),
        acties
      ])
    ]);
  }

  // Dagtotalen opnieuw berekenen na een lokale wijziging
  function herbereken(k) {
    const d = dagen[k];
    if (!d) return;
    let t = 0, p = 0, a = 0;
    (res[k] || []).forEach(function (x) {
      if (x.status !== "Geannuleerd") { t += x.tafels; p += x.personen; a++; }
    });
    d.bezetTafels = t; d.personen = p; d.reserveringen = a;
  }

  // Statuswijziging: direct zichtbaar, daarna opslaan op de achtergrond
  async function wijzigStatus(x, sel) {
    const nieuw = sel.value;
    const oud = x.status;
    if (nieuw === oud) return;
    if (nieuw === "Geannuleerd" && !confirm("Reservering van " + x.naam + " annuleren? De tafels komen weer vrij.")) {
      sel.value = oud;
      return;
    }
    reqTeller++;   // een verversing die nog onderweg is, mag deze wijziging niet overschrijven
    pending++;
    x.status = nieuw;
    herbereken(x.datum);
    render();
    try {
      const r = await api({ actie: "beheer_status", id: x.id, status: nieuw }, { pogingen: 2 });
      if (r.result === "success") {
        toast(x.naam + ": " + nieuw.toLowerCase());
      } else {
        x.status = oud; herbereken(x.datum); render();
        if (r.code === "PIN") { pending--; uitloggen(r.message); return; }
        toast(r.message || "Wijzigen mislukt.", true);
      }
    } catch (err) {
      x.status = oud; herbereken(x.datum); render();
      toast("Geen verbinding. De wijziging is niet opgeslagen.", true);
    }
    pending--;
    if (pending === 0 && venster) herlaad(true);   // haalt o.a. de juiste dagstatus en no-show-meldingen op
  }

  // ===== Navigatie =====
  function toonDag() { $("zoekView").hidden = true; $("dagView").hidden = false; }

  function toonLaden() {
    $("lijst").textContent = "";
    $("lijst").append(el("p", { class: "leeg", text: "Laden…" }));
  }

  async function gaNaar(d) {
    $("zoek").value = "";
    $("zoekWis").hidden = true;
    zoekTeller++;
    toonDag();
    const maandag = addDagen(d, -((weekdag(d) + 6) % 7));
    // Binnen de geladen periode? Dan direct tonen, zonder wachten
    if (venster && maandag >= venster.van && addDagen(maandag, 6) <= venster.tot) {
      datum = d;
      render();
      return;
    }
    // Buiten de geladen periode: één keer een nieuwe periode ophalen
    const vorige = datum;
    datum = d;
    $("datumTitel").textContent = mooi(d);
    toonLaden();
    const ok = await laadBereik(addDagen(d, -14), addDagen(d, 42), { meldNieuw: false });
    if (!ok && datum === d) { datum = vorige; if (venster) render(); }
  }

  $("vorigeDag").addEventListener("click", function () { if (datum) gaNaar(addDagen(datum, -1)); });
  $("volgendeDag").addEventListener("click", function () { if (datum) gaNaar(addDagen(datum, 1)); });
  $("vandaagKnop").addEventListener("click", function () { if (vandaag) gaNaar(vandaag); });
  $("datumKies").addEventListener("change", function (e) { if (e.target.value) gaNaar(e.target.value); });
  $("vernieuw").addEventListener("click", function () { herlaad(false); });
  $("opnieuw").addEventListener("click", function () { herlaad(false); });
  $("printKnop").addEventListener("click", function () { window.print(); });
  $("nieuwKnop").addEventListener("click", function () { openForm("nieuw", null); });
  $("opschoonKnop").addEventListener("click", function () { openOpschonen(); });

  // ===== Zoeken: eerst direct in de geladen weken, daarna ook op de server (alle reserveringen) =====
  function zoekLokaal(q) {
    const z = q.toLowerCase();
    const cijfers = q.replace(/\D/g, "");
    const alle = [];
    Object.keys(res).forEach(function (k) { res[k].forEach(function (x) { alle.push(x); }); });
    const treffers = alle.filter(function (x) {
      if ((x.naam || "").toLowerCase().indexOf(z) !== -1) return true;
      if ((x.id || "").toLowerCase().indexOf(z) !== -1) return true;
      if ((x.email || "").toLowerCase().indexOf(z) !== -1) return true;
      if (cijfers.length >= 3 && (x.telefoon || "").replace(/\D/g, "").indexOf(cijfers) !== -1) return true;
      return false;
    });
    const toekomst = treffers.filter(function (x) { return x.datum >= vandaag; })
      .sort(function (a, b) { return a.datum < b.datum ? -1 : a.datum > b.datum ? 1 : (a.tijd < b.tijd ? -1 : a.tijd > b.tijd ? 1 : 0); });
    const verleden = treffers.filter(function (x) { return x.datum < vandaag; })
      .sort(function (a, b) { return a.datum < b.datum ? 1 : a.datum > b.datum ? -1 : 0; });
    return toekomst.concat(verleden).slice(0, 60);
  }

  function zoekRij(x) {
    return el("button", { type: "button", class: "zres", onclick: function () { gaNaar(x.datum); } }, [
      el("div", null, [
        el("strong", { text: x.naam }),
        el("small", { text: mooi(x.datum, true) + " · " + x.tijd + " · " + x.id })
      ]),
      el("div", { class: "rechts", text: x.personen + " pers. · " + x.status })
    ]);
  }

  // status: "kort" (nog geen server), "bezig" (server zoekt nog), "klaar", "fout"
  function toonZoekResultaten(items, status) {
    const lijst = $("zoekLijst");
    lijst.textContent = "";
    if (status === "fout") {
      lijst.append(el("div", { class: "melding" }, [
        el("span", { text: "De server reageerde niet goed. Alleen de reserveringen in het overzicht zijn doorzocht." }),
        el("button", { type: "button", text: "Opnieuw proberen", onclick: function () {
          const q = $("zoek").value.trim();
          if (q.length >= 3) { toonZoekResultaten(zoekLokaal(q), "bezig"); zoek(q); }
        } })
      ]));
    } else if (status === "bezig") {
      lijst.append(el("p", { class: "hint", text: "Zoeken in alle reserveringen\u2026" }));
    } else if (status === "kort") {
      lijst.append(el("p", { class: "hint", text: "Typ minstens 3 tekens om ook in andere periodes te zoeken." }));
    }
    if (!items.length && status !== "bezig") lijst.append(el("p", { class: "leeg", text: "Geen reserveringen gevonden." }));
    items.forEach(function (x) { lijst.append(zoekRij(x)); });
  }

  $("zoek").addEventListener("input", function () {
    clearTimeout(zoekTimer);
    const q = $("zoek").value.trim();
    $("zoekWis").hidden = !$("zoek").value;
    if (q.length < 2) { zoekTeller++; toonDag(); return; }
    $("dagView").hidden = true;
    $("zoekView").hidden = false;
    if (q.length < 3) { toonZoekResultaten(zoekLokaal(q), "kort"); return; }
    toonZoekResultaten(zoekLokaal(q), "bezig");
    zoekTimer = setTimeout(function () { zoek(q); }, 600);
  });
  $("zoekWis").addEventListener("click", function () {
    clearTimeout(zoekTimer);
    zoekTeller++;
    $("zoek").value = "";
    $("zoekWis").hidden = true;
    toonDag();
    $("zoek").focus();
  });

  async function zoek(q) {
    const mijn = ++zoekTeller;
    let r = null;
    try { r = await api({ actie: "beheer_zoek", q: q }, { pogingen: 3 }); } catch (err) { r = null; }
    if (mijn !== zoekTeller || $("zoek").value.trim() !== q) return;   // er is intussen iets anders getypt
    if (!r) { toonZoekResultaten(zoekLokaal(q), "fout"); return; }
    if (r.code === "PIN") { uitloggen(r.message); return; }
    if (r.result !== "success") { toonZoekResultaten(zoekLokaal(q), "fout"); return; }
    toonZoekResultaten(r.resultaten, "klaar");
  }

  // ===== Venster openen en sluiten =====
  function openModal(titel) {
    modalOpener = document.activeElement;
    $("mTitel").textContent = titel;
    $("mBody").textContent = "";
    $("mFoot").textContent = "";
    $("overlay").hidden = false;
    document.body.style.overflow = "hidden";
    modalOpen = true;
  }

  function sluitModal(zonderFocus) {
    $("overlay").hidden = true;
    document.body.style.overflow = "";
    modalOpen = false;
    form = null;
    $("mBody").textContent = "";
    $("mFoot").textContent = "";
    if (!zonderFocus && modalOpener && modalOpener.focus) { try { modalOpener.focus(); } catch (e) {} }
  }

  $("mSluit").addEventListener("click", function () { sluitModal(); });
  document.addEventListener("keydown", function (e) {
    if (modalOpen && e.key === "Escape") sluitModal();
  });

  function toonModalFout(tekst) {
    const f = $("mFout");
    if (!f) return;
    f.textContent = tekst;
    f.hidden = false;
    try { f.scrollIntoView({ block: "nearest" }); } catch (e) {}
  }

  // ===== Reservering toevoegen (telefonisch) of wijzigen =====
  function veld(id, label, invoer) {
    return el("div", { class: "veld" }, [el("label", { for: id, text: label }), invoer]);
  }

  function openForm(modus, x) {
    if (!venster) return;
    let startDatum = "";
    if (modus === "wijzig") {
      startDatum = x.datum;
    } else {
      const k = kalenderBoek[datum];
      if (datum >= vandaag && k && k.status !== "GESLOTEN") startDatum = datum;
    }
    const basis = deel(startDatum || vandaag);
    form = {
      modus: modus,
      res: x || null,
      datum: startDatum,
      tijd: x ? x.tijd : "",
      personen: Math.min(cfg.maxPersonenTel || 30, Math.max(1, x ? (x.personen || 2) : 2)),
      maand: { j: basis[0], m: basis[1] - 1 },
      bezig: false,
      mailAangeraakt: false
    };

    openModal(modus === "wijzig" ? "Reservering wijzigen" : "Nieuwe reservering (telefonisch)");
    const body = $("mBody");

    // Aantal personen
    const persInput = el("input", { type: "number", id: "fPers", min: "1", max: String(cfg.maxPersonenTel || 30), inputmode: "numeric" });
    persInput.value = form.personen;
    persInput.addEventListener("input", function () {
      const n = parseInt(persInput.value, 10);
      form.personen = isNaN(n) ? 0 : n;
      updateInfo();
    });
    function setPers(n) {
      n = Math.min(cfg.maxPersonenTel || 30, Math.max(1, n));
      form.personen = n;
      persInput.value = n;
      updateInfo();
    }
    const minder = el("button", { type: "button", class: "icon-btn", "aria-label": "Eén persoon minder", text: "\u2212" });
    const meer = el("button", { type: "button", class: "icon-btn", "aria-label": "Eén persoon meer", text: "+" });
    minder.addEventListener("click", function () { setPers((parseInt(persInput.value, 10) || 1) - 1); });
    meer.addEventListener("click", function () { setPers((parseInt(persInput.value, 10) || 0) + 1); });

    // Gegevens
    const naam = el("input", { type: "text", id: "fNaam", maxlength: "80", autocomplete: "off" });
    const tel = el("input", { type: "tel", id: "fTel", maxlength: "25", autocomplete: "off", inputmode: "tel" });
    const email = el("input", { type: "email", id: "fEmail", maxlength: "120", autocomplete: "off" });
    const opm = el("textarea", { id: "fOpm", maxlength: "300", rows: "2" });
    if (x) { naam.value = x.naam || ""; tel.value = x.telefoon || ""; email.value = x.email || ""; opm.value = x.opmerking || ""; }

    const mail = el("input", { type: "checkbox", id: "fMail" });
    mail.addEventListener("change", function () { form.mailAangeraakt = true; });
    email.addEventListener("input", syncMail);
    [naam, tel, email].forEach(function (i) {
      i.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); verstuurForm(false); }
      });
    });

    body.append(
      el("div", { class: "sec" }, [
        el("span", { class: "lbl", text: "Datum" }),
        el("div", { id: "fCal" }),
        el("p", { class: "hint", id: "fInfo" })
      ]),
      el("div", { class: "sec" }, [
        el("span", { class: "lbl", text: "Tijdstip" }),
        el("div", { class: "tkgrid", id: "fTijden", role: "radiogroup", "aria-label": "Tijdstip" })
      ]),
      el("div", { class: "sec" }, [
        el("label", { class: "lbl", for: "fPers", text: "Aantal personen" }),
        el("div", { class: "stepper" }, [minder, persInput, meer])
      ]),
      veld("fNaam", "Naam *", naam),
      veld("fTel", "Telefoonnummer (optioneel)", tel),
      veld("fEmail", "E-mailadres (optioneel, leeg = geen mail)", email),
      veld("fOpm", "Opmerking (optioneel, bijv. allergie of kinderstoel)", opm),
      el("label", { class: "check" }, [
        mail,
        el("span", { text: modus === "wijzig"
          ? "Stuur de gast een mail over de wijziging (alleen bij een andere datum, tijd of ander aantal personen)"
          : "Stuur een bevestigingsmail naar de gast" })
      ]),
      el("div", { class: "melding", id: "mFout", role: "alert", hidden: "" })
    );

    $("mFoot").append(
      el("button", { type: "button", class: "btn licht", text: "Annuleren", onclick: function () { sluitModal(); } }),
      el("button", { type: "button", class: "btn", id: "fOpslaan", text: modus === "wijzig" ? "Opslaan" : "Reserveren", onclick: function () { verstuurForm(false); } })
    );

    renderFormCal();
    renderFormTijden();
    updateInfo();
    syncMail();
    $("modal").focus();
  }

  function syncMail() {
    const c = $("fMail");
    if (!c || !form) return;
    const geldig = EMAIL_RE.test($("fEmail").value.trim());
    c.disabled = !geldig;
    if (!geldig) c.checked = false;
    else if (!form.mailAangeraakt) c.checked = true;
  }

  function renderFormTijden() {
    const c = $("fTijden");
    c.textContent = "";
    (cfg.tijden || []).forEach(function (t) {
      const l = el("label", { class: "tk" });
      const i = el("input", { type: "radio", name: "ftijd", value: t });
      i.checked = (form.tijd === t);
      i.addEventListener("change", function () { form.tijd = t; });
      l.append(i, el("span", { text: t }));
      c.append(l);
    });
  }

  function updateInfo() {
    const info = $("fInfo");
    if (!info || !form) return;
    const perTafel = cfg.perTafel || 4;
    const nodig = Math.max(1, Math.ceil((form.personen || 1) / perTafel));
    if (!form.datum) { info.textContent = "Kies een datum."; info.className = "hint"; return; }
    const k = kalenderBoek[form.datum];
    let tekst = mooi(form.datum, true);
    let waarschuwing = false;
    if (k && k.status === "GESLOTEN") {
      waarschuwing = true;
      tekst += " \u2014 gesloten. Doorgaan vraagt om een extra bevestiging.";
    } else if (!k) {
      tekst += " \u2014 beschikbaarheid onbekend";
    } else {
      let vrij = k.vrij;
      const r0 = form.res;
      if (r0 && r0.datum === form.datum && r0.status !== "Geannuleerd" && r0.status !== "No-show") vrij += r0.tafels;
      tekst += " \u2014 " + vrij + " tafel(s) vrij, deze reservering neemt " + nodig + " in";
      if (vrij < nodig) { waarschuwing = true; tekst += ". Doorgaan vraagt om een extra bevestiging."; }
    }
    info.textContent = tekst;
    info.className = "hint" + (waarschuwing ? " warn" : "");
  }

  function renderFormCal() {
    const box = $("fCal");
    box.textContent = "";
    const j = form.maand.j, m = form.maand.m;
    const idx = j * 12 + m;
    const vp = deel(vandaag);
    const minIdx = vp[0] * 12 + vp[1] - 1;
    const keys = Object.keys(kalenderBoek).sort();
    let maxKey = keys.length ? keys[keys.length - 1] : vandaag;
    if (form.datum && form.datum > maxKey) maxKey = form.datum;
    const mp = deel(maxKey);
    const maxIdx = mp[0] * 12 + mp[1] - 1;

    const prev = el("button", { type: "button", class: "icon-btn", "aria-label": "Vorige maand", text: "\u2039" });
    const next = el("button", { type: "button", class: "icon-btn", "aria-label": "Volgende maand", text: "\u203A" });
    prev.disabled = idx <= minIdx;
    next.disabled = idx >= maxIdx;
    prev.addEventListener("click", function () {
      form.maand.m--; if (form.maand.m < 0) { form.maand.m = 11; form.maand.j--; }
      renderFormCal();
    });
    next.addEventListener("click", function () {
      form.maand.m++; if (form.maand.m > 11) { form.maand.m = 0; form.maand.j++; }
      renderFormCal();
    });
    box.append(el("div", { class: "maandnav" }, [
      prev,
      el("strong", { text: new Date(j, m, 1).toLocaleDateString("nl-NL", { month: "long", year: "numeric" }) }),
      next
    ]));

    const grid = el("div", { class: "kgrid", role: "group", "aria-label": "Kalender" });
    MA_EERST.forEach(function (d) { grid.append(el("div", { class: "khead", "aria-hidden": "true", text: d })); });
    const eerste = (new Date(j, m, 1).getDay() + 6) % 7;
    for (let i = 0; i < eerste; i++) grid.append(el("div"));

    const aantal = new Date(j, m + 1, 0).getDate();
    for (let dag = 1; dag <= aantal; dag++) {
      const key = j + "-" + pad(m + 1) + "-" + pad(dag);
      const info = kalenderBoek[key];
      const isOrig = !!form.res && form.res.datum === key;
      // Ook gesloten en volle dagen zijn te kiezen (met een waarschuwing); alleen het verleden en dagen buiten de boekbare periode niet
      const kiesbaar = (!!info && key >= vandaag) || isOrig;
      const st = info ? info.status : "";
      const b = el("button", {
        type: "button",
        class: "kday" + (st ? " s-" + st.toLowerCase() : "") + (key === form.datum ? " sel" : "") + (kiesbaar ? "" : " off"),
        "aria-label": mooi(key) + (st ? ", " + STATUS_TEKST[st] : ""),
        "aria-pressed": key === form.datum ? "true" : "false"
      }, [el("span", { text: String(dag) }), el("span", { class: "dot" })]);
      if (kiesbaar) {
        b.addEventListener("click", function () {
          form.datum = key;
          renderFormCal();
          updateInfo();
        });
      } else {
        b.setAttribute("aria-disabled", "true");
        b.tabIndex = -1;
      }
      grid.append(b);
    }
    box.append(grid);
    box.append(el("div", { class: "klegenda", "aria-hidden": "true" }, [
      el("span", null, [el("i", { style: "background:var(--vrij)" }), document.createTextNode("Vrij")]),
      el("span", null, [el("i", { style: "background:var(--beperkt)" }), document.createTextNode("Beperkt")]),
      el("span", null, [el("i", { style: "background:var(--vol)" }), document.createTextNode("Vol (toch boeken kan)")]),
      el("span", null, [el("i", { style: "background:var(--gesloten)" }), document.createTextNode("Gesloten (toch boeken kan)")])
    ]));
  }

  function mailTekst(m) {
    if (!m) return { tekst: "", fout: false };
    if (/FOUT/.test(m)) return { tekst: " \u2014 let op: de mail aan de gast kon niet worden verstuurd", fout: true };
    if (/quota/.test(m)) return { tekst: " \u2014 de mail is niet verstuurd (dagelijkse maillimiet bereikt)", fout: true };
    if (/OK/.test(m)) return { tekst: " \u2014 mail aan de gast verstuurd", fout: false };
    return { tekst: "", fout: false };
  }

  async function verstuurForm(overrule) {
    if (!form || form.bezig) return;
    const fout = $("mFout");
    fout.hidden = true;
    const naam = $("fNaam").value.trim();
    const tel = $("fTel").value.trim();
    const email = $("fEmail").value.trim();
    const opm = $("fOpm").value.trim();
    const pers = parseInt($("fPers").value, 10);
    const max = cfg.maxPersonenTel || 30;

    if (!form.datum) return toonModalFout("Kies een datum.");
    if (!form.tijd) return toonModalFout("Kies een tijdstip.");
    if (!pers || pers < 1 || pers > max) return toonModalFout("Kies 1 tot " + max + " personen.");
    if (!naam) return toonModalFout("Vul de naam in.");
    if (email && !EMAIL_RE.test(email)) return toonModalFout("Het e-mailadres is niet geldig.");
    form.personen = pers;

    const modus = form.modus;
    const gekozen = form.datum;
    const body = {
      actie: modus === "wijzig" ? "beheer_wijzig" : "beheer_boek",
      datum: gekozen,
      tijd: form.tijd,
      personen: pers,
      naam: naam,
      telefoon: tel,
      email: email,
      opmerking: opm,
      mailGast: !!(email && $("fMail").checked),
      overrule: !!overrule
    };
    if (modus === "wijzig") body.id = form.res.id;

    const knop = $("fOpslaan");
    form.bezig = true;
    knop.disabled = true;
    knop.textContent = "Bezig\u2026";

    let r = null;
    try { r = await api(body, { timeout: 30000 }); } catch (err) { r = null; }   // geen automatische herhaling: dat kan dubbele reserveringen of mails geven

    if (!form) return;   // het venster is intussen gesloten
    form.bezig = false;
    knop.disabled = false;
    knop.textContent = modus === "wijzig" ? "Opslaan" : "Reserveren";

    if (!r) return toonModalFout("Geen verbinding met de server. Controleer in de lijst of de reservering al is opgeslagen voordat je het opnieuw probeert.");
    if (r.code === "PIN") { uitloggen(r.message); return; }

    if (r.result === "success") {
      const mt = mailTekst(r.mail);
      sluitModal();
      if (modus === "wijzig") toast("Reservering gewijzigd" + mt.tekst, mt.fout);
      else toast("Reservering " + r.bookingId + " toegevoegd" + mt.tekst, mt.fout);
      naWijziging(gekozen);
      return;
    }
    if (r.code === "GESLOTEN" && !overrule) {
      if (confirm("Let op: we zijn deze dag gesloten.\n\nToch een reservering " + (modus === "wijzig" ? "op deze dag zetten" : "maken") + "?")) return verstuurForm(true);
      return;
    }
    if (r.code === "VOL" && !overrule) {
      if (confirm(r.message + "\n\nToch doorgaan?")) return verstuurForm(true);
      return;
    }
    toonModalFout(r.message || "Opslaan is niet gelukt.");
  }

  // ===== Opschonen =====
  function maandenWaarde() {
    const n = parseInt($("oMaanden").value, 10);
    return Math.min(60, Math.max(1, isNaN(n) ? (cfg.bewaartermijn || 3) : n));
  }

  function openOpschonen() {
    if (!venster) return;
    openModal("Opschonen");
    const maanden = el("input", { type: "number", id: "oMaanden", min: "1", max: "60", inputmode: "numeric" });
    maanden.value = cfg.bewaartermijn || 3;
    maanden.addEventListener("input", function () { $("oResultaat").textContent = ""; $("mFout").hidden = true; });
    $("mBody").append(
      el("p", { class: "uitleg", text: "Verwijdert reserveringen waarvan de datum langer dan het gekozen aantal maanden geleden is. Toekomstige reserveringen blijven altijd staan." }),
      veld("oMaanden", "Ouder dan (aantal maanden)", maanden),
      el("div", { id: "oResultaat" }),
      el("p", { class: "hint", text: "Nieuwsbrief-aanmeldingen worden bewaard in het tabblad Nieuwsbrief, no-shows in het tabblad No-shows en de maandcijfers in het tabblad Statistiek." }),
      el("div", { class: "melding", id: "mFout", role: "alert", hidden: "" })
    );
    $("mFoot").append(
      el("button", { type: "button", class: "btn licht", text: "Sluiten", onclick: function () { sluitModal(); } }),
      el("button", { type: "button", class: "btn", id: "oVoorbeeld", text: "Voorbeeld tonen", onclick: opschoonVoorbeeld })
    );
    $("modal").focus();
  }

  function orij(label, waarde) {
    return el("div", { class: "orij" }, [el("span", { text: label }), el("strong", { text: waarde })]);
  }

  async function opschoonVoorbeeld() {
    const m = maandenWaarde();
    const knop = $("oVoorbeeld");
    knop.disabled = true;
    knop.textContent = "Bezig\u2026";
    $("mFout").hidden = true;
    let r = null;
    try { r = await api({ actie: "beheer_opschonen_voorbeeld", maanden: m }, { pogingen: 2 }); } catch (err) { r = null; }
    if (!modalOpen || !$("oVoorbeeld")) return;
    knop.disabled = false;
    knop.textContent = "Voorbeeld tonen";
    const box = $("oResultaat");
    box.textContent = "";
    if (!r) return toonModalFout("Geen verbinding met de server.");
    if (r.code === "PIN") { uitloggen(r.message); return; }
    if (r.result !== "success") return toonModalFout(r.message || "Het voorbeeld kon niet worden opgehaald.");

    box.append(el("div", { class: "oBox" }, [
      orij("Reserveringen met een datum v\u00f3\u00f3r", mooi(r.grens)),
      orij("Worden verwijderd", String(r.verwijderen)),
      orij("Nieuw in tabblad Nieuwsbrief", String(r.nieuwsbrief)),
      orij("Nieuw in tabblad No-shows", String(r.noShows))
    ]));
    if (!r.verwijderen) {
      box.append(el("p", { class: "hint", text: "Er is niets om op te schonen." }));
      return;
    }
    const chk = el("input", { type: "checkbox", id: "oChk" });
    const del = el("button", { type: "button", class: "btn gevaar", id: "oDel", disabled: "", text: "Definitief verwijderen" });
    chk.addEventListener("change", function () { del.disabled = !chk.checked; });
    del.addEventListener("click", function () { opschoonUitvoeren(r.maanden); });
    box.append(
      el("label", { class: "check" }, [chk, el("span", { text: "Ik begrijp dat verwijderen niet ongedaan gemaakt kan worden." })]),
      del
    );
  }

  async function opschoonUitvoeren(maanden) {
    const del = $("oDel");
    del.disabled = true;
    del.textContent = "Bezig met opschonen\u2026";
    let r = null;
    try { r = await api({ actie: "beheer_opschonen", maanden: maanden, bevestig: true }, { timeout: 60000 }); } catch (err) { r = null; }
    if (!modalOpen || !$("oDel")) return;
    if (!r) {
      del.disabled = false;
      del.textContent = "Definitief verwijderen";
      return toonModalFout("Geen verbinding met de server. Controleer eerst of het opschonen al is uitgevoerd.");
    }
    if (r.code === "PIN") { uitloggen(r.message); return; }
    if (r.result !== "success") {
      del.disabled = false;
      del.textContent = "Definitief verwijderen";
      return toonModalFout(r.message || "Opschonen is niet gelukt.");
    }
    sluitModal();
    toast("Opgeschoond: " + r.verwijderd + " reserveringen verwijderd, " + r.nieuwsbrief + " naar Nieuwsbrief, " + r.noShows + " naar No-shows");
    herlaad(false);
  }

  // ===== Automatisch verversen op de achtergrond =====
  function kanVerversen() {
    return !$("app").hidden && !document.hidden && venster && pending === 0 && !modalOpen &&
      $("zoek").value.trim().length < 2 &&
      !(document.activeElement && document.activeElement.tagName === "SELECT");
  }
  setInterval(function () { if (kanVerversen()) herlaad(true); }, 60000);
  document.addEventListener("visibilitychange", function () { if (kanVerversen()) herlaad(true); });

  // ===== Start =====
  (function start() {
    let p = "";
    try { p = sessionStorage.getItem(SLEUTEL) || localStorage.getItem(SLEUTEL) || ""; } catch (e) {}
    if (!p) { toonLogin(""); return; }
    pin = p;
    toonApp();
    toonLaden();
    laadBereik("", "", { meldNieuw: false });
  })();
})();
</script>
</body>
</html>
